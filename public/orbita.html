<meta name="theme-color" content="#07060a">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
  window.__pwaPrompt = null;

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: full-bleed WebGL orbit. Left column: on-air + schedule + thought of the day. Right: config deck with tabs (bottom sheet on phones).
   Bottom: station card (left) and live captions (centre). Accent colours follow the music (set from JS). Single dark look by design. */
:root {
  --bg: #07060a; --ink: #ece8f4; --ink-dim: #8d879c; --line: rgba(236,232,244,.14); --glass: rgba(14,12,20,.66);
  --accent: #ff6b3d; --live: #8f6bff; --accent-ink: #120805; --ok: #6fe3b0;
  --fokus: #8f6bff; --chill: #35d0b5; --energia: #ff4f9a; --noc: #4d7dff;
  --font-ui: "Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-display: "Unbounded", "Azeret Mono", system-ui, sans-serif;
  --font-read: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(14px, env(safe-area-inset-top, 0px)); --gb: max(14px, env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 12px; letter-spacing: .02em; overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: none; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#stage { position: fixed; inset: 0; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.sat-label { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 6px; white-space: nowrap; text-transform: uppercase; font-size: 10px; color: var(--ink); background: rgba(7,6,10,.74); border: 1px solid rgba(236,232,244,.1); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); will-change: transform, opacity; }
.sat-label b { font-weight: 500; color: var(--ink); font-size: 11px; }
.sat-label small { font-size: 10px; color: var(--ink-dim); }
.sat-label.tuned b { color: var(--accent); }
.sat-label.in-group b { color: var(--ink); text-shadow: 0 0 8px var(--accent); }
.sat-label.blend b { text-decoration: underline; text-underline-offset: 3px; }
.moon-label { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; border: 1px solid var(--line); background: rgba(7,6,10,.8); color: var(--ink); padding: 3px 7px; font-size: 10px; text-transform: uppercase; white-space: nowrap; will-change: transform; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.moon-label[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.host-label { position: absolute; left: 0; top: 0; display: flex; gap: 6px; align-items: center; padding: 3px 8px; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; background: rgba(7,6,10,.8); border: 1px solid var(--line); will-change: transform, opacity; transition: border-color .2s; }
.host-label i { width: 6px; height: 6px; background: var(--ink-dim); }
.host-label.talking { border-color: var(--accent); }
.host-label.talking i { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

.hud { position: fixed; display: flex; align-items: center; gap: 10px; text-transform: uppercase; font-size: 11px; z-index: 5; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-tl { top: var(--gt); left: var(--gl); }
.hud-tr { top: var(--gt); right: var(--gr); }
.hud-bl { bottom: var(--gb); left: var(--gl); font-variant-numeric: tabular-nums; pointer-events: none; }
.hud-br { bottom: var(--gb); right: var(--gr); font-variant-numeric: tabular-nums; pointer-events: none; }
.hud .sep { width: 1px; height: 14px; background: var(--ink); opacity: .6; }
.brand { font-weight: 700; letter-spacing: .08em; display: inline-flex; align-items: baseline; gap: 8px; }
.brand .tagline { font-weight: 400; letter-spacing: .06em; color: var(--ink-dim); font-size: 10px; text-transform: none; }
.hud-icon { width: 26px; height: 22px; display: inline-grid; place-items: center; padding: 0; background: none; border: 1px solid var(--line); color: var(--ink-dim); }
.hud-icon svg { width: 14px; height: 14px; }
.hud-icon:hover { color: var(--ink); }
.hud-icon[aria-pressed="true"] { color: var(--accent-ink); background: var(--ink); border-color: var(--ink); }
#nowPlaying { position: fixed; bottom: calc(var(--gb) + 2px); left: 50%; transition: opacity .3s; transform: translateX(-50%); z-index: 4; display: flex; align-items: baseline; gap: 10px; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 10px rgba(0,0,0,.8); }
body.has-captions #nowPlaying { opacity: 0; }
.hud-kbd { pointer-events: auto; background: none; border: 0; padding: 0; cursor: pointer; }
.hud-kbd:hover kbd { color: var(--ink); border-color: var(--ink-dim); }
#nowPlaying .np-eyebrow { font-size: 9px; text-transform: uppercase; letter-spacing: .18em; color: var(--ink-dim); }
#nowPlaying b { font-family: var(--font-display); font-weight: 500; font-size: 15px; letter-spacing: .01em; }
#nowPlaying #npHost { font-family: var(--font-read); font-size: 12px; color: var(--ink-dim); font-style: italic; }
.hud-link { background: none; border: 0; padding: 0; font-weight: 700; text-transform: uppercase; }
.hud-link:hover, .lang button:hover { color: var(--accent); }
.hud-link.change-version { font-weight: 400; text-transform: none; text-decoration: underline; text-underline-offset: 3px; opacity: .75; }
.lang { display: flex; border: 1px solid var(--line); }
.lang button { background: none; border: 0; padding: 2px 6px; font-size: 10px; color: var(--ink-dim); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
.badge { padding: 2px 6px; border: 1px solid var(--line); }
.badge.live { border-color: var(--accent); color: var(--accent); }
#trialPill { display: flex; gap: 8px; align-items: center; padding: 3px 8px; border: 1px solid var(--accent); color: var(--ink); background: rgba(7,6,10,.6); font-variant-numeric: tabular-nums; cursor: pointer; }
#trialPill b { color: var(--accent); font-weight: 700; }
#trialPill .ring { width: 14px; height: 14px; }

/* left column */
#leftCol { position: fixed; top: calc(var(--gt) + 34px); left: var(--gl); width: 290px; z-index: 5; display: grid; gap: 8px; }
.glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px) saturate(1.15); -webkit-backdrop-filter: blur(10px) saturate(1.15); }
/* backdrop blur over a live WebGL canvas is re-rendered every frame (~3 ms on an Intel iGPU at 1440x900):
   below the top quality tiers the panels go solid instead */
body[data-quality="low"] .glass, body[data-quality="medium"] .glass, body[data-quality="high"] .glass,
body[data-quality="low"] .moon-label:not([aria-pressed="true"]), body[data-quality="medium"] .moon-label:not([aria-pressed="true"]), body:not([data-quality="ultra"]) .sat-label, body:not([data-quality="ultra"]) .sh-btn, body:not([data-quality="ultra"]) #ringBar, body[data-quality="low"] #captions p, body[data-quality="medium"] #captions p
  { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(12,10,17,.9); }
#onair { padding: 10px 12px; display: grid; gap: 6px; }
#autoRamowkaBar { padding: 9px 12px; display: grid; gap: 5px; border-color: var(--accent); }
.ramowka-top { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink); }
.ramowka-top .dot.live { width: 7px; height: 7px; background: var(--accent); box-shadow: 0 0 8px var(--accent); flex: none; animation: blink 1.2s ease-in-out infinite; }
.ramowka-cta { font-size: 10px; color: var(--ink-dim); text-decoration: none; display: inline-flex; gap: 4px; align-items: center; }
.ramowka-cta b { color: var(--accent); font-weight: 700; }
.ramowka-cta:hover { color: var(--ink); }
.grp-tree { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.grp-acc, .grp-stations { min-width: 0; }
.grp-sum .btn { flex: none; }
.grp-st > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp-st small { flex: none; }
.grp-acc { border: 1px solid var(--line); background: rgba(236,232,244,.02); }
.grp-acc.active { border-color: var(--accent); }
.grp-sum { list-style: none; cursor: pointer; padding: 7px 9px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.grp-sum::-webkit-details-marker { display: none; }
.grp-title { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; text-transform: uppercase; min-width: 0; }
.grp-title b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp-title small { color: var(--ink-dim); font-size: 10px; }
.grp-dot { width: 7px; height: 7px; flex: none; display: inline-block; }
.grp-tag { padding: 0 9px 6px; }
.grp-stations { display: grid; gap: 3px; padding: 0 7px 7px; }
.grp-st { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 7px; border: 1px solid transparent; background: rgba(236,232,244,.03); text-align: left; font-size: 11px; color: var(--ink); }
.grp-st small { font-size: 9px; color: var(--ink-dim); text-transform: uppercase; white-space: nowrap; }
.grp-st:hover { border-color: var(--line); }
.grp-st.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.onair-row { display: flex; align-items: center; gap: 8px; text-transform: uppercase; font-size: 10px; letter-spacing: .1em; }
.onair-row .dot { width: 7px; height: 7px; background: var(--ink-dim); }
#onair.live .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
#onairState { font-weight: 700; }
#nextLine { color: var(--ink-dim); font-size: 11px; line-height: 1.4; text-transform: none; letter-spacing: .01em; }
#storyBox { display: grid; gap: 4px; padding-top: 6px; border-top: 1px solid var(--line); }
#storyBox b { font-size: 12px; line-height: 1.35; font-weight: 500; }
#storyBox a { font-size: 10px; color: var(--ink-dim); }
details#sched { padding: 0; }
#sched summary { list-style: none; cursor: pointer; padding: 9px 12px; text-transform: uppercase; font-size: 10px; letter-spacing: .1em; font-weight: 700; display: flex; justify-content: space-between; }
#sched summary::-webkit-details-marker { display: none; }
#sched summary::after { content: "+"; color: var(--ink-dim); }
#sched[open] summary::after { content: "–"; }
#schedList { list-style: none; margin: 0; padding: 0 12px 10px; display: grid; gap: 6px; }
#schedList li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; font-size: 11px; line-height: 1.35; }
#schedList time { color: var(--accent); font-variant-numeric: tabular-nums; }
#schedList .empty { grid-template-columns: 1fr; color: var(--ink-dim); }
#stoic { padding: 12px; display: grid; gap: 8px; }
#stoic .eyebrow { display: flex; justify-content: space-between; }
#stoicQuote { margin: 0; font-family: var(--font-display); font-size: 14px; line-height: 1.35; font-weight: 500; text-wrap: balance; }
#stoicAuthor { color: var(--ink-dim); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#card .actions { padding-top: 6px; border-top: 1px solid var(--line); }
#card .actions .btn { height: 30px; padding: 0 10px; font-size: 10px; }
#card .actions .btn.plus { border-color: var(--accent); color: var(--accent); }
#card .actions #favStarBtn { width: 30px; height: 30px; border-radius: 0; }

/* captions */
/* captions: a readable proportional face, solid backdrop (contrast stays >= 7:1 over any frame), at most 3 lines */
#captions { position: fixed; left: 50%; bottom: calc(var(--gb) + 40px); transform: translateX(-50%); z-index: 6; width: min(680px, calc(100vw - 32px)); text-align: center; pointer-events: none; transition: opacity .3s; }
#captions .who { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; padding: 3px 9px; background: rgba(7,6,10,.88); border: 1px solid var(--accent); color: var(--ink); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; }
#captions .who::before { content: ""; width: 6px; height: 6px; background: var(--accent); }
#captions p { margin: 0 auto; max-width: 52ch; padding: 10px 16px 11px; background: rgba(7,6,10,.86); border-left: 2px solid var(--accent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-family: var(--font-read); font-size: clamp(16px, 1.55vw, 20px); font-weight: 450; line-height: 1.5; letter-spacing: .005em; color: #f6f3fb; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* station card */
#card { position: fixed; left: var(--gl); bottom: calc(var(--gb) + 30px); z-index: 6; width: min(360px, calc(100vw - 32px)); display: grid; gap: 7px; padding: 13px 15px; }
.eyebrow { font-size: 10px; text-transform: uppercase; color: var(--ink-dim); letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.cat-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; background: var(--live); }
#cardName { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 2.6vw, 28px); line-height: 1.05; letter-spacing: -.01em; text-wrap: balance; }
#cardTag { margin: 0; color: var(--ink-dim); line-height: 1.45; }
#cardHost { margin: 0; font-size: 11px; text-transform: uppercase; }
#cardHost span { color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--line); background: rgba(236,232,244,.04); text-transform: uppercase; font-size: 11px; font-weight: 500; text-decoration: none; color: var(--ink); transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn:hover { border-color: rgba(236,232,244,.35); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.icon { width: 34px; padding: 0; }
.btn.wide { width: 100%; }
.btn.small { height: 28px; padding: 0 9px; font-size: 10px; }
.btn svg { width: 14px; height: 14px; }
kbd { font: inherit; font-size: 10px; padding: 1px 4px; border: 1px solid var(--line); color: var(--ink-dim); }
.eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.eq i { width: 2px; background: currentColor; height: 30%; }
.playing .eq i { animation: eq .9s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.3s !important; } .eq i:nth-child(3) { animation-delay: -.6s !important; }
@keyframes eq { 0%,100% { height: 25%; } 50% { height: 100%; } }
#startNotice { display: flex; align-items: flex-start; gap: 7px; margin: 0; font-size: 12px; line-height: 1.45; color: var(--ink-dim); }
#startNotice[hidden] { display: none; }
#startNotice svg { flex: 0 0 auto; width: 13px; height: 13px; margin-top: 2px; animation: startPulse 1.8s ease-in-out infinite; }
@keyframes startPulse { 50% { opacity: .35; } }
#blendInfo { display: flex; align-items: center; gap: 8px; font-size: 11px; text-transform: uppercase; color: var(--ink-dim); }
#blendInfo b { color: var(--ink); font-weight: 500; }
#blendInfo button { background: none; border: 1px solid var(--line); width: 22px; height: 22px; padding: 0; }

/* deck */
#deck { position: fixed; top: calc(var(--gt) + 34px); right: var(--gr); bottom: calc(var(--gb) + 30px); width: 320px; z-index: 6; display: flex; flex-direction: column; user-select: text; -webkit-user-select: text; touch-action: pan-y; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); flex: none; }
.tabs button { height: 40px; background: none; border: 0; border-bottom: 2px solid transparent; text-transform: uppercase; font-size: 10px; letter-spacing: .1em; color: var(--ink-dim); display: flex; align-items: center; justify-content: center; gap: 6px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.tabs .pip { min-width: 16px; height: 16px; padding: 0 3px; box-sizing: border-box; background: var(--accent); color: var(--accent-ink); font-size: 9px; display: inline-grid; place-items: center; font-weight: 700; }
.panes { overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; flex: 1; scrollbar-width: thin; scrollbar-color: rgba(236,232,244,.2) transparent; }
.group { padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; border-bottom: 1px solid var(--line); }
.group h2 { margin: 0; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.hint { color: var(--ink-dim); font-size: 10px; font-weight: 400; letter-spacing: .02em; text-transform: none; margin: 0; line-height: 1.45; }
.lead { margin: 0; color: var(--ink-dim); font-size: 11px; line-height: 1.55; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); }
.seg button { height: 32px; border: 0; background: none; text-transform: uppercase; font-size: 10px; color: var(--ink-dim); }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 28px; padding: 0 10px; border: 1px solid var(--line); background: none; font-size: 10px; text-transform: uppercase; color: var(--ink-dim); display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chip kbd { padding: 0 3px; font-size: 9px; }
.chip .star { opacity: .35; }
.chip .star.on { opacity: 1; color: var(--accent); }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 11px; cursor: pointer; }
.toggle input { appearance: none; -webkit-appearance: none; width: 30px; height: 16px; border: 1px solid var(--line); position: relative; margin: 0; cursor: pointer; flex: none; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: var(--ink-dim); transition: transform .15s; }
.toggle input:checked { border-color: var(--accent); }
.toggle input:checked::after { transform: translateX(14px); background: var(--accent); }
.field { display: grid; gap: 6px; font-size: 10px; text-transform: uppercase; color: var(--ink-dim); }
.field input, .field select, .field textarea { min-height: 34px; padding: 0 10px; background: rgba(236,232,244,.04); border: 1px solid var(--line); color: var(--ink); text-transform: none; font-size: 12px; min-width: 0; width: 100%; box-sizing: border-box; border-radius: 0; }
.field textarea { padding: 8px 10px; resize: vertical; line-height: 1.4; }
.field select option { background: #141119; }
.ivals { display: flex; flex-wrap: wrap; gap: 4px; }
.ivals button { flex: 1; min-width: 34px; height: 30px; border: 1px solid var(--line); background: none; font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.ivals button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { display: flex; gap: 8px; align-items: flex-start; font-size: 11px; line-height: 1.4; min-width: 0; }
.list li > span:last-child, .list li a { min-width: 0; overflow-wrap: anywhere; }
.tag { flex: none; font-size: 9px; padding: 1px 5px; border: 1px solid var(--line); text-transform: uppercase; color: var(--ink-dim); }
.tag.hot { border-color: var(--accent); color: var(--accent); }
.connector { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; padding: 12px; border: 1px solid var(--line); }
.connector .logo { width: 32px; height: 32px; display: grid; place-items: center; background: var(--ink); color: var(--bg); font-weight: 700; font-family: var(--font-display); font-size: 14px; }
.lock { display: inline-flex; gap: 5px; align-items: center; font-size: 9px; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 1px 5px; letter-spacing: .08em; }
.progress { height: 4px; background: var(--line); position: relative; }
.progress i { position: absolute; inset: 0 auto 0 0; background: var(--accent); transition: width .4s; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.steps button { width: 100%; display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: center; text-align: left; padding: 8px 4px; background: none; border: 0; border-bottom: 1px dashed var(--line); font-size: 11px; line-height: 1.35; }
.steps .box { width: 14px; height: 14px; border: 1px solid var(--ink-dim); display: grid; place-items: center; font-size: 10px; }
.steps .done { color: var(--ink-dim); text-decoration: line-through; }
.steps .done .box { background: var(--ok); border-color: var(--ok); color: #04150d; text-decoration: none; }
.plans { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.plan { border: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; align-content: start; }
.plan.featured { border-color: var(--accent); }
.plan b { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.price { font-family: var(--font-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.price small { font-family: var(--font-ui); font-size: 10px; font-weight: 400; color: var(--ink-dim); white-space: nowrap; display: inline-block; }
.plan ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.plan li { font-size: 10px; color: var(--ink-dim); line-height: 1.4; padding-left: 12px; position: relative; }
.plan li::before { content: "+"; position: absolute; left: 0; color: var(--accent); }
.mobile-only { display: none; }
.deck-head { justify-content: space-between; align-items: center; padding: 8px var(--gr) 4px var(--gl); flex: none; }
.deck-head .grip { width: 40px; height: 4px; background: var(--line); }

/* overlays */
#enter { position: fixed; inset: 0; z-index: 20; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-items: center; overflow-y: auto; padding: 24px var(--gr) 24px var(--gl); background: radial-gradient(ellipse at 50% 60%, rgba(7,6,10,.5), rgba(7,6,10,.94) 70%); transition: opacity .6s, visibility .6s; }
#enter.gone { opacity: 0; visibility: hidden; }
.enter-inner { width: min(540px, 100%); display: grid; gap: 16px; }
.enter-inner h1 { margin: 0; font-family: var(--font-display); font-size: clamp(44px, 9vw, 88px); line-height: .95; letter-spacing: -.03em; }
.enter-inner h1 span { color: var(--accent); }
.enter-inner p { margin: 0; color: var(--ink-dim); font-size: 13px; line-height: 1.6; max-width: 48ch; }
.enter-inner p.free { color: var(--ink); border-left: 2px solid var(--accent); padding-left: 10px; }
.enter-meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-dim); font-size: 10px; text-transform: uppercase; align-items: center; }
.enter-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.enter-actions .btn { height: 42px; padding: 0 18px; }
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: start center; padding: 10vh var(--gr) 24px var(--gl); background: rgba(7,6,10,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); overflow-y: auto; }
.modal-box { width: min(560px, 100%); background: #110f17; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.modal-box.pad { padding: 22px; display: grid; gap: 14px; box-sizing: border-box; }
.modal h2 { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.15; text-wrap: balance; }
#palInput { width: 100%; box-sizing: border-box; height: 52px; padding: 0 18px; background: none; border: 0; border-bottom: 1px solid var(--line); font-size: 15px; outline: none; }
#palList { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow-y: auto; }
#palList li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; cursor: pointer; font-size: 12px; }
#palList li small { color: var(--ink-dim); font-size: 10px; text-transform: uppercase; white-space: nowrap; }
#palList li[aria-selected="true"] { background: rgba(255,255,255,.06); color: var(--accent); }
.pal-foot { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--ink-dim); font-size: 10px; }
#info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 12px; }
#info dt { color: var(--accent); text-transform: uppercase; font-size: 10px; padding-top: 2px; white-space: nowrap; }
#info dd { margin: 0; line-height: 1.45; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { border: 1px solid var(--line); padding: 10px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 9px; text-transform: uppercase; color: var(--ink-dim); letter-spacing: .08em; }
#authForm { display: grid; gap: 10px; }
.err { color: #ff9a9a; font-size: 11px; margin: 0; min-height: 14px; }
#toast { position: fixed; left: 50%; top: calc(var(--gt) + 40px); transform: translateX(-50%); z-index: 40; display: flex; gap: 12px; align-items: center; padding: 9px 14px; background: var(--ink); color: var(--bg); font-size: 11px; text-transform: uppercase; font-weight: 500; max-width: calc(100vw - 32px); line-height: 1.4; }
#toast button { background: none; border: 0; border-left: 1px solid rgba(7,6,10,.25); padding: 0 0 0 12px; color: var(--bg); font-weight: 700; text-transform: uppercase; white-space: nowrap; }
#toast.error { background: #ff9a9a; }

/* listener comments on air */
#cmtFeed { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 7px; }
#cmtFeed[hidden] { display: none; }
.cmt-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.cmt-list li { display: flex; align-items: baseline; gap: 6px; font-size: 11px; color: var(--ink-dim); min-width: 0; }
.cmt-list b { color: var(--ink); font-weight: 500; white-space: nowrap; }
.cmt-line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cmt-badge { flex: none; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 1px 5px; background: var(--accent); color: var(--accent-ink); }
.cmt-mine { border: 1px solid var(--line); padding: 7px 9px; display: grid; gap: 5px; }
.cmt-mine.aired { border-color: var(--accent); background: rgba(255,107,61,.07); }
.cmt-head { display: flex; align-items: center; gap: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.cmt-head svg { width: 13px; height: 13px; flex: none; }
.cmt-mine.aired .cmt-head svg { color: var(--accent); }
.cmt-text { margin: 0; font-size: 12px; color: var(--ink-dim); line-height: 1.4; overflow-wrap: anywhere; }
.cmt-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.cmt-actions .btn.playing { border-color: var(--accent); }
.cmt-form { display: grid; gap: 10px; }
.cmt-field { display: grid; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-dim); }
.cmt-top { display: flex; justify-content: space-between; }
.cmt-field textarea, .cmt-field input { font: inherit; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); background: rgba(236,232,244,.05); border: 1px solid var(--line); padding: 8px 10px; width: 100%; box-sizing: border-box; resize: vertical; }
.cmt-field textarea:focus, .cmt-field input:focus { outline: 1px solid var(--accent); }
.cmt-err { margin: 0; color: #ff8a7a; font-size: 12px; }
.cmt-err:empty { display: none; }
.cmt-foot { display: flex; gap: 8px; justify-content: flex-end; }
@media (max-width: 760px) {
  #cmtFeed .cmt-list { display: none; }
  #cmtFeed .cmt-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 11px; }
  #cmtFeed .cmt-mine { padding: 6px 8px; gap: 4px; }
}

@media (max-width: 1100px) { #leftCol { width: 250px; } #stoic { display: none; } #nowPlaying, .brand .tagline { display: none; } }
@media (max-width: 760px) {
  .mobile-only { display: inline-flex; }
  #leftCol { left: var(--gl); right: var(--gr); width: auto; top: calc(var(--gt) + 28px); gap: 5px; }
  #sched, #storyBox { display: none !important; }
  #onair { padding: 6px 10px; }
  #deck { top: auto; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); width: auto; height: calc(100dvh - 104px - env(safe-area-inset-bottom, 0px)); transform: translateY(115%); transition: transform .28s cubic-bezier(.2,.8,.2,1); z-index: 30; border-left: 0; border-right: 0; padding-bottom: 12px; }
  #deck.open { transform: none; }
  #deckBtn { display: none !important; }
  .group { padding-left: var(--gl); padding-right: var(--gr); }
  #card { left: var(--gl); right: var(--gr); width: auto; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); padding: 10px 12px; }
  #captions { bottom: auto; top: 46%; z-index: 9; } /* above the thumb dial (z 8), below the deck sheet and nav */
  #captions p { font-size: 16px; padding: 8px 12px; }
  #orbPwaBtn span, #trialPill > span { display: none; }
  #orbPwaBtn { width: 28px; padding: 0 !important; justify-content: center; }
  .hud-tl { gap: 6px; }
  /* phone: keep the card as short as before the action row was added, so it never covers the thumb dial */
  #cardTag { display: none; }
  #card { gap: 5px; }
  #card .transport .btn { height: 32px; }
  #card .transport .btn.primary { padding: 0 10px; }
  #card .transport .eq { display: none; }
  #card .actions { padding-top: 5px; gap: 5px; }
  #card .actions .btn { width: 40px; padding: 0; }
  #card .actions .btn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #card .actions #favStarBtn { width: 40px; }
  .td-hint { text-shadow: 0 1px 6px #000, 0 0 2px #000; color: rgba(236,232,244,.8) !important; }
  .host-label { display: none; }
  .hud-br .hold-txt, .hud-tr .freq-top, .hud-tl .howto-wrap { display: none; }
  .hud { gap: 5px; font-size: 10px; }
  #classicViewBtn { height: 24px; padding: 0 7px; font-size: 9px; }
  /* the top HUD is full on phones: "zmień wersję" sits in the free space under the filter bar */
  .hud-tl { z-index: 9; } /* lets the fixed link below sit above the thumb dial (8) */
  #changeVersionBtn { position: fixed; top: calc(132px + env(safe-area-inset-top, 0px)); right: 16px; font-size: 10px; }
  .lang button { padding: 2px 4px; font-size: 9px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .plans { grid-template-columns: 1fr; }
}
body.calm *, body.calm *::before, body.calm *::after { animation: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>

<div id="stage"><canvas id="gl"></canvas><div id="labels"></div></div>

<header class="hud hud-tl">
  <span class="brand">AMBIRADIO<small class="tagline" data-i18n="tagline"></small></span><span class="sep howto-wrap"></span><button id="infoBtn" class="hud-link howto-wrap" type="button" data-i18n="howto"></button><button id="changeVersionBtn" class="hud-link change-version" type="button" data-i18n="changeVersion"></button>

  <span id="modeBadge" class="badge"></span><span class="sep freq-top"></span><span id="freqTop" class="freq-top"></span>
</div>

<div class="hud hud-br"><button id="paletteBtn" class="hud-kbd" type="button" aria-label="Ctrl+K" aria-keyshortcuts="Control+K"><kbd>Ctrl+K</kbd></button><span class="sep"></span><span class="hold-txt" data-i18n="holdSeek"></span><span class="sep hold-txt"></span><span id="speedVal">1.00x</span></div>

{ "imports": {

o=()=>rt({pl:"Twoja muzyka. Twoje tematy. Twoje życie.",en:"Your music. Your topics. Your life.",ru:"Твоя музыка. Твои темы. Твоя жизнь."}),ua=(t,e)=>rt({pl:[["A",`Dzień dobry, tu ${t}.`],["B",`A ja jestem ${e}. To nasz pierwszy wspólny odcinek i od razu o rzeczy najważniejszej: dlaczego to radio jest twoje.`],["A","Zacznijmy od muzyki. Zwykłe radio gra to, co lubi średni słuchacz. Tutaj muzyka powstaje na żywo, pod stację, którą wybierasz, a nawet pod nastrój, który opiszesz jednym zdaniem."],["B","Wpisujesz na przykład: deszczowy wieczór, herbata i kodowanie. I za chwilę gra dokładnie to. Nie playlista z tysiąca piosenek, tylko muzyka zrobiona w tej sekundzie."],["music"],["A","Druga rzecz to tematy. Wybierasz, o czym chcesz słyszeć: sztuczna inteligencja, sport, moda, stoicy, coś śmiesznego na rozluźnienie."],["B","I sam decydujesz, jak często. Raz na minutę, jeśli lubisz być na bieżąco, albo raz na godzinę, jeśli pracujesz w skupieniu."],["A","Najciekawsze są jednak twoje własne źródła. Słowa kluczowe, kanały RSS, a od niedawna także skrzynka mailowa. Rano słyszysz trzy najważniejsze maile i co z nimi zrobić."],["B","Czyli zamiast otwierać pocztę o siódmej rano, słuchasz jej przy kawie. Brzmi jak drobiazg, a oszczędza głowę na cały dzień."],["music"],["A","Trzecia rzecz to twoje życie. Radio ma pamiętać, co już słyszałeś, żeby się nie powtarzać, i podsuwać to, co ma sens o tej porze dnia."],["B","Do tego podcasty takie jak ten. Podajesz dowolny temat, a my we dwoje rozmawiamy o nim kilka minut i zostawiamy sam konkret."],["A","I codziennie odrobina stoików. Krótka myśl, która pomaga oddzielić to, na co masz wpływ, od reszty."],["B","Masz teraz godzinę, żeby to wszystko sprawdzić. Wygeneruj swój pierwszy podcast, jest za darmo. Pokręć tarczą. Kliknij księżyc z tematem."],["A","Twoja muzyka. Twoje tematy. Twoje życie. To było AmbiRadio."],["B","Do usłyszenia."]],en:[["A",`Good morning, I'm ${t}.`],["B",`And I'm ${e}. This is our first episode together, and we start with the most important thing: why this radio is yours.`],["A","Let us start with music. Regular radio plays what the average listener likes. Here the music is made live, for the station you choose, or even for a mood you describe in one sentence."],["B","You type, say, rainy evening, tea and coding. And a moment later that is exactly what plays. Not a playlist of a thousand songs, but music made this very second."],["music"],["A","The second thing is topics. You choose what you want to hear about: artificial intelligence, sport, fashion, the Stoics, something silly to relax."],["B","And you decide how often. Every minute if you like to keep up, or once an hour if you are deep in focus."],["A","The most interesting part is your own sources. Keywords, RSS feeds, and now your inbox too. In the morning you hear your three most important emails and what to do with them."],["B","So instead of opening email at seven in the morning, you listen to it over coffee. Sounds small, but it saves your head for the whole day."],["music"],["A","The third thing is your life. The radio remembers what you have already heard, so it does not repeat itself, and suggests what makes sense at this time of day."],["B","Plus podcasts like this one. Give us any topic and the two of us talk about it for a few minutes, keeping just the essentials."],["A","And a little Stoicism every day. A short thought that helps you separate what you control from everything else."],["B","You now have an hour to try it all. Generate your first podcast, it is free. Turn the dial. Click a topic moon."],["A","Your music. Your topics. Your life. This was AmbiRadio."],["B","Talk soon."]],ru:[["A",`Доброе утро, это ${t}.`],["B",`А я ${e}. Это наш первый общий выпуск, и начнём с главного: почему это радио твоё.`],["A","Начнём с музыки. Обычное радио играет то, что нравится среднему слушателю. Здесь музыка рождается вживую, под станцию, которую ты выбрал, и даже под настроение, которое ты опишешь одной фразой."],["B",
