# dosradio.theones.io — DOS Radio Standalone PWA (Vite build + FastAPI on 127.0.0.1:3015)
# Traffic: Cloudflare -> cloudflared tunnel ('*.theones.io' -> https://localhost:443) -> this vhost.
server {
    listen 80;
    listen [::]:80;
    server_name dosradio.theones.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dosradio.theones.io;

    ssl_certificate /etc/letsencrypt/live/theones.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theones.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/dosradio.theones.io;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /radio-api/ {
        proxy_pass http://127.0.0.1:3015;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 240s;
        client_max_body_size 16k;
    }

    location ^~ /radio-ws/ {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # PWA assets & static files
    location ~* \.(webmanifest|js|png|ico|svg|wav|opus)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html =404;
    }
}
